<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#245c4b"><title>LinguaLoop</title><script>
// Apply the saved appearance before the first paint, including the loading shell.
try {
  const mode = localStorage.getItem('lingualoop-appearance');
  document.documentElement.dataset.theme = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
} catch {
  document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
</script></head><body><div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
